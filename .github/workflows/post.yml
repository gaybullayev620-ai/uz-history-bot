
name: Daily Uzbek Reels

on:
  # Har kuni Toshkent vaqti bilan 11:00 da
  schedule:
    - cron: "0 6 * * *"

    # Qo'lda ishga tushirish
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sinov rejimi: video yasaladi, Instagram'ga joylanmaydi"
        type: boolean
        default: false

permissions:
  contents: write 

jobs:
  create-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Repository'ni yuklash
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python o'rnatish
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. FFmpeg o'rnatish
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. Python kutubxonalarini o'rnatish
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Reels yaratish
      - name: Create Instagram Reels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python main.py
      # 5b. Ishlatilgan mavzularni saqlash
      - name: Save used topics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "Update used topics"
          git push
      # 6. Tayyor videolarni saqlash
      - name: Upload finished Reels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finished-reels
          path: |
            output/reels.mp4
            output/sources.txt
            output/script.json
          if-no-files-found: warn
          retention-days: 7
