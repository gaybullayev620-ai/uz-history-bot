name: Daily history reels

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run python main.py
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/final.mp4
          if-no-files-found: ignore

      - name: Save used topics
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add used_topics.json
          git diff --cached --quiet || git commit -m "update topics"
          git push
