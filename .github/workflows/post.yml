{"name": "Daily history reel", "on": {"schedule": [{"cron": "0 12 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"run": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}, {"run": "sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core"}, {"run": "pip install -r requirements.txt"}, {"run": "python main.py", "env": {"DRY_RUN": "${{ vars.DRY_RUN || 'true' }}", "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}", "PEXELS_API_KEY": "${{ secrets.PEXELS_API_KEY }}", "CLOUDINARY_CLOUD": "${{ secrets.CLOUDINARY_CLOUD }}", "CLOUDINARY_KEY": "${{ secrets.CLOUDINARY_KEY }}", "CLOUDINARY_SECRET": "${{ secrets.CLOUDINARY_SECRET }}", "IG_USER_ID": "${{ secrets.IG_USER_ID }}", "IG_TOKEN": "${{ secrets.IG_TOKEN }}"}}, {"uses": "actions/upload-artifact@v4", "with": {"name": "reel", "path": "out/final.mp4"}}, {"run": "git config user.name bot && git config user.email bot@users.noreply.github.com && git add used_topics.json && (git commit -m update-topics && git push || true)"}]}}}
